<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{{ PRODUCT_NAME }}}</title>
  <link rel="stylesheet" href="site.css">
</head>
<body>
  <main>
    <canvas id="unity-canvas" width="{{{ WIDTH }}}" height="{{{ HEIGHT }}}" tabindex="-1"></canvas>
    <p id="unity-status" role="status">載入遊戲中…</p>
    <button id="unity-fullscreen" type="button" disabled>全螢幕</button>
  </main>
  <script>
    const statusElement = document.querySelector("#unity-status");
    const fullscreenButton = document.querySelector("#unity-fullscreen");
    const buildDirectory = "Build";
    const loaderScript = document.createElement("script");
    loaderScript.src = buildDirectory + "/{{{ LOADER_FILENAME }}}";
    loaderScript.onerror = () => { statusElement.textContent = "無法載入遊戲程式。"; };
    loaderScript.onload = () => {
      createUnityInstance(document.querySelector("#unity-canvas"), {
        dataUrl: buildDirectory + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildDirectory + "/{{{ FRAMEWORK_FILENAME }}}",
        codeUrl: buildDirectory + "/{{{ CODE_FILENAME }}}",
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        showBanner: (message, type) => {
          statusElement.textContent = message;
          statusElement.dataset.type = type;
        }
      }, progress => {
        statusElement.textContent = "載入遊戲中 " + Math.round(progress * 100) + "%";
      }).then(unityInstance => {
        statusElement.textContent = "";
        fullscreenButton.disabled = false;
        fullscreenButton.onclick = () => unityInstance.SetFullscreen(1);
      }).catch(error => {
        statusElement.textContent = "遊戲載入失敗：" + String(error);
      });
    };
    document.body.appendChild(loaderScript);
  </script>
</body>
</html>
