name: Build and deploy WebRPG test WebGL

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: webrpg-firebase-test
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false

      - name: Check Unity CI credentials
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          for name in UNITY_EMAIL UNITY_PASSWORD UNITY_LICENSE; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required secret: $name"
              exit 1
            fi
          done

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Build shared library and verify Unity copy
        run: |
          dotnet build WebRPGShared/WebRPGShared.csproj --configuration Release
          cmp WebRPGShared/bin/Release/netstandard2.1/WebRPGShared.dll WebRPG/Assets/Plugins/WebRPGShared.dll
          cmp WebRPGShared/bin/Release/netstandard2.1/WebRPGShared.pdb WebRPG/Assets/Plugins/WebRPGShared.pdb

      - name: Configure WebGL to use the test server
        run: |
          catalog=WebRPG/Assets/WebRPG/Data/LobbyClient.json
          jq '.DefaultServerId = "test" | .Servers = [{
            Id: "test",
            Name: "Test",
            Url: "wss://ws-test.oldshaw-webrpg.com/ws?channel=lobby",
            EditorOnly: false
          }]' "$catalog" > "$catalog.tmp"
          mv "$catalog.tmp" "$catalog"

      - name: Prepare CI-only Unity sources
        run: |
          test ! -e WebRPG/Assets/Editor/WebRPGContinuousIntegration
          test ! -e WebRPG/Assets/WebGLTemplates/WebRPGContinuousIntegration
          mkdir -p WebRPG/Assets/Editor/WebRPGContinuousIntegration
          mkdir -p WebRPG/Assets/WebGLTemplates/WebRPGContinuousIntegration
          mkdir -p artifacts
          cp WebRPGPage/ci/UnityWebBuild.cs WebRPG/Assets/Editor/WebRPGContinuousIntegration/
          cp -R WebRPGPage/template/. WebRPG/Assets/WebGLTemplates/WebRPGContinuousIntegration/

      - name: Free runner disk space for Unity
        run: |
          df -h /
          # This job has already built the shared DLL; Unity uses its container toolchain.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /usr/share/swift
          sudo rm -rf /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          docker image prune --all --force
          df -h /

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: WebRPG/Library
          key: ${{ runner.os }}-WebRPG-Test-WebGL-Library-v1-${{ hashFiles('WebRPG/ProjectSettings/ProjectVersion.txt', 'WebRPG/Packages/manifest.json', 'WebRPG/Packages/packages-lock.json', 'WebRPGPage/ci/UnityWebBuild.cs', '.github/workflows/deploy-test-web-to-firebase.yml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-WebRPG-Test-WebGL-Library-v1-${{ hashFiles('WebRPG/ProjectSettings/ProjectVersion.txt', 'WebRPG/Packages/manifest.json', 'WebRPG/Packages/packages-lock.json', 'WebRPGPage/ci/UnityWebBuild.cs', '.github/workflows/deploy-test-web-to-firebase.yml') }}-
            ${{ runner.os }}-WebRPG-Test-WebGL-Library-v1-

      - name: Build Unity Web
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          projectPath: WebRPG
          unityVersion: 6000.3.11f1
          customImage: unityci/editor@sha256:0b183011e2e7f72f5e1a6bbce3898c6a328572db621968772cbe39ea58511b5c
          targetPlatform: WebGL
          buildMethod: WebRPG.ContinuousIntegration.UnityWebBuild.Build
          versioning: None
          allowDirtyBuild: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare final Hosting content
        run: node WebRPGPage/ci/prepare-hosting.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: firebase-test-hosting-${{ github.sha }}
          path: artifacts/firebase-hosting/
          if-no-files-found: error
          retention-days: 14

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: firebase-test
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: firebase-test-hosting-${{ github.sha }}
          path: artifacts/firebase-hosting

      - name: Verify final content
        working-directory: artifacts/firebase-hosting
        run: sha256sum --check SHA256SUMS

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@15.34.0

      - name: Require latest main commit
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.git.getRef({
              ...context.repo,
              ref: 'heads/main'
            });
            if (data.object.sha !== context.sha) {
              core.setFailed('This commit is no longer the latest main commit. Deployment skipped.');
            }

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: oldshaw-web-rpg
          workload_identity_provider: ${{ vars.FIREBASE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
          create_credentials_file: true

      - name: Deploy saved artifact to Firebase Hosting
        working-directory: artifacts/firebase-hosting
        run: |
          firebase target:apply hosting test oldshaw-web-rpg-test --project oldshaw-web-rpg --non-interactive
          jq '.hosting.target = "test"' firebase.json > firebase.test.json
          firebase deploy --only hosting:test --project oldshaw-web-rpg --config firebase.test.json --non-interactive

      - name: Verify public test WebGL
        working-directory: artifacts/firebase-hosting
        run: |
          wasm=$(find public/Build -maxdepth 1 -name '*.wasm' -printf '%f\n' -quit)
          test -n "$wasm"
          curl --fail --silent --show-error --max-time 20 https://test.oldshaw-webrpg.com/ |
            cmp - public/index.html
          curl --fail --silent --show-error --max-time 20 --head \
            "https://test.oldshaw-webrpg.com/Build/$wasm" |
            tr -d '\r' | grep -iFx 'Content-Type: application/wasm'
